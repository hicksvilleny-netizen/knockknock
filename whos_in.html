<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's In - Kumon Attendance Kiosk</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161b22;
      --accent-cyan: #00f2fe;
      --accent-red: #ff4b4b;
      --text-main: #ffffff;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    /* HEADER BAR STYLING */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

.brand-logo {
  height: 70px; /* Increased display size */
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5)); /* Creates a floating 3D effect */
}



    .header-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      margin: 0;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    .header-center {
      flex: 1;
      text-align: center;
    }

    .live-clock {
      font-family: 'Courier New', monospace, sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 14px rgba(0, 242, 254, 0.5);
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .badge-count {
      background: rgba(0, 242, 254, 0.1);
      border: 1.5px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 10px 22px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    /* GRID & CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .card.completed {
      border-color: var(--accent-red);
      box-shadow: 0 0 18px rgba(255, 75, 75, 0.4);
    }

    .circle-container {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto 12px auto;
    }

    .circle-container svg {
      width: 124px;
      height: 124px;
      transform: rotate(-90deg);
    }

    .circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 8;
    }

    .circle-progress {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
      /* Add the animation line here */
      animation: ringPulse 3s infinite ease-in-out;
    }
/* Add the keyframes rule right below it */
    @keyframes ringPulse {
      0% { filter: drop-shadow(0 0 2px currentColor); }
      50% { filter: drop-shadow(0 0 8px currentColor); }
      100% { filter: drop-shadow(0 0 2px currentColor); }
    }

    @keyframes cardAppear {
    from {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    }
    to {
    opacity: 1;
    transform: translateY(0) scale(1);
    }
}

.card {
  animation: cardAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

    .name-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 82%;
      text-align: center;
      line-height: 1.2;
      text-shadow: none !important;
      word-break: break-word;
    }

    .card-footer {
      margin-top: 10px;
      font-size: 0.88rem;
    }

    .time-in {
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .status-text {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 1.3rem;
      background: rgba(22, 27, 34, 0.5);
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="header-left">
      <img src="TransparentLOGO0.png" alt="Kumon Logo" class="brand-logo" />
      <h1 class="header-title">WHO'S IN?</h1>
    </div>
    
    <div class="header-center">
      <div id="liveClock" class="live-clock">--:--:-- --</div>
    </div>

    <div class="header-right">
      <div id="activeCount" class="badge-count">Active Students: 0</div>
    </div>
  </header>

  <div id="studentGrid" class="grid">
    <div class="empty-state">Loading active check-ins...</div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/a/macros/ikumon.com/s/AKfycbycDY0o23zb3D7qq_2kLZOFvc8AKMR5kVj-NZoB3DRVkLpb1Pf2SGURuJ-aGY5O1Ts0/exec?type=getDashboard";
    const dismissedIds = new Set();
    const colorPalette = ['#00f2fe', '#38ef7d', '#ffeb3b', '#a78bfa', '#ff007f', '#fb923c', '#2dd4bf', '#c084fc'];

    function getColorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colorPalette[Math.abs(hash) % colorPalette.length];
    }

    function getAllottedMinutes(subjects, days) {
      if (subjects == 1 && days == 2) return 30;
      if (subjects == 2 && days == 2) return 60;
      if (subjects == 1 && days == 1) return 120;
      if (subjects == 2 && days == 1) return 60;
      return 30;
    }

    // LIVE DIGITAL CLOCK
    function startLiveClock() {
      const clockEl = document.getElementById('liveClock');
      function update() {
        if (!clockEl) return;
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString([], { 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit' 
        });
      }
      update();
      setInterval(update, 1000);
    }

    async function fetchAttendance() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        processData(data);
      } catch (err) {
        console.error("Dashboard fetch error:", err);
      }
    }

    function processData(rows) {
      const studentMap = {};

      rows.forEach(row => {
        if (!row || row.length < 6) return;
        const [timestamp, studentId, studentName, subjects, days, action] = row;
        const id = String(studentId).trim();
        
        if (dismissedIds.has(id)) return;

        // Safely parse timestamps from Google Sheets
        let time;
        if (timestamp instanceof Date) {
          time = timestamp;
        } else {
          const str = String(timestamp).trim();
          time = new Date(str);
          
          // Fallback parser for standard sheet date strings
          if (isNaN(time.getTime())) {
            const parts = str.split(' ');
            if (parts.length >= 2) {
              const [dateParts, timeParts] = [parts[0].split('/'), parts[1].split(':')];
              if (dateParts.length === 3 && timeParts.length >= 2) {
                time = new Date(
                  dateParts[2],
                  dateParts[0] - 1,
                  dateParts[1],
                  timeParts[0],
                  timeParts[1],
                  timeParts[2] || 0
                );
              }
            }
          }
        }

        if (!time || isNaN(time.getTime())) return;

        // Store/update to keep the student's latest scan entry
        if (!studentMap[id] || studentMap[id].timestamp < time) {
          studentMap[id] = {
            id: id,
            name: String(studentName).trim(),
            subjects: parseInt(subjects) || 1,
            days: parseInt(days) || 2,
            action: String(action).trim().toLowerCase(),
            checkInTime: time,
            timestamp: time
          };
        }
      });

      // FILTER: Only show active check-ins from TODAY
      const todayStr = new Date().toDateString();

      const active = Object.values(studentMap).filter(s => {
        const isToday = s.checkInTime.toDateString() === todayStr;
        return isToday && s.action === 'checked in';
      });

      renderGrid(active);
    }

    function renderGrid(students) {
      const grid = document.getElementById('studentGrid');
      const activeCount = document.getElementById('activeCount');
      if (activeCount) activeCount.textContent = `Active Students: ${students.length}`;
      if (!grid) return;
      
      grid.innerHTML = '';

      if (students.length === 0) {
        grid.innerHTML = `<div class="empty-state">No active students checked in right now.</div>`;
        return;
      }

      const now = new Date();

      students.forEach(student => {
        const allotted = getAllottedMinutes(student.subjects, student.days);
        const elapsed = Math.floor((now - student.checkInTime) / 60000);
        const percent = Math.min(100, Math.max(0, Math.floor((elapsed / allotted) * 100)));
        const isDone = elapsed >= allotted;

        const radius = 52;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (percent / 100) * circumference;
        const color = isDone ? '#ff4b4b' : getColorForName(student.name);

        const card = document.createElement('div');
        card.className = `card ${isDone ? 'completed' : ''}`;
        card.onclick = () => {
          if (confirm(`Dismiss ${student.name} from dashboard?`)) {
            dismissedIds.add(student.id);
            card.remove();
            if (activeCount) activeCount.textContent = `Active Students: ${document.querySelectorAll('.card').length}`;
          }
        };

        card.innerHTML = `
          <div class="circle-container">
            <svg viewBox="0 0 120 120">
              <circle class="circle-bg" cx="60" cy="60" r="${radius}" />
              <circle class="circle-progress" cx="60" cy="60" r="${radius}" stroke="${color}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" />
            </svg>
            <div class="name-label">${student.name}</div>
          </div>
          <div class="card-footer">
            <div class="time-in">In: ${student.checkInTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            <div class="status-text" style="color: ${color}">${isDone ? "TIME'S UP!" : `${elapsed}m / ${allotted}m`}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Initialize clock and start data fetch loops
    startLiveClock();
    fetchAttendance();
    setInterval(fetchAttendance, 10000);
  </script>
</body>
</html>
